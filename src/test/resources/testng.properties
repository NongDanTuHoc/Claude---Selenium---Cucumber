# TestNG global configuration
# https://testng.org/doc/documentation.html

# Default suite name when running without XML
testng.default.suite.name=Default Suite

# Do not fail on no tests found
testng.checkTestNamesInSuite=true

# Configuration failure policy: continue | skip | continue (skip is default)
testng.configfailurepolicy=continue

# Preserve order of test methods
testng.preserveorder=true

# Parallel execution at method level
testng.parallel=methods
testng.threadCount=4

# Enable verbose output
testng.verbose=2

# TimeOut in milliseconds applied to all test methods (global safety net)
# Uncomment to enforce: testng.timeOut=60000

# Whether to run test methods in random order
testng.runNbrOfTimes=0

# Whether to skip method invocation counts
testng.invocationCounts.ignored=true

# Reporter implementation
testng.reporter=org.testng.reporters.JUnitReportReporter

# XML output directory
testng.outputDir=reports/test-output
