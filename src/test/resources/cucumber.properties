# Cucumber runtime configuration
# https://cucumber.io/docs/cucumber/configuration/

# Enable ANSI colour output in console
cucumber.ansi-colors.disabled=false

# Publish Cucumber report to cloud (disable unless required)
cucumber.publish.enabled=false

# Enable snippets for missing step definitions
cucumber.snippet.pending-Undefined=true

# Set the default glue path
cucumber.glue=com.company.automation.hooks,com.company.automation.stepdefinitions

# Feature file encoding
cucumber.features=src/test/resources/features

# Plugin output (also set in @CucumberOptions — this is a fallback)
# cucumber.plugin=html:reports/cucumber/html, json:reports/cucumber/json

# Enable cucumber expressions instead of Cucumber Gherkin regex
cucumber.expressions.enabled=true

# JVM argument: allow redefinition of Cucumber options via CLI
cucumber.options=--plugin html:reports/cucumber/html --plugin json:reports/cucumber/json

# Filter by tags at runtime: -Dcucumber.filter.tags="@smoke and @login"
# Can also use: cucumber.filter.tags="@regression"
