# Environment: DEVELOPMENT
env=dev

# Application Under Test
app.baseurl=https://dev.example.com
app.timeout=30
app.implicitwait=10

# Selenium WebDriver
driver.type=chrome
driver.headless=false
driver.window.maximize=true
driver.remote.enabled=false
driver.remote.url=

# Database
db.enabled=false
db.type=mysql
db.host=localhost
db.port=3306
db.name=testdb
db.username=root
db.password=root

# API
api.baseurl=https://dev-api.example.com
api.timeout=30000

# Reporting
report.screenshot.onfailure=true
report.path=reports/extent
report.html.enabled=true

# Logging
log.level=DEBUG
log.pattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n