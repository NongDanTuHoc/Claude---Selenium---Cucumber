# Environment: PRODUCTION
env=prod

# Application Under Test
app.baseurl=https://prod.example.com
app.timeout=60
app.implicitwait=5

# Selenium WebDriver
driver.type=chrome
driver.headless=true
driver.window.maximize=false
driver.remote.enabled=true
driver.remote.url=http://selenium-grid:4444/wd/hub

# Database
db.enabled=false
db.type=postgresql
db.host=prod-db.example.com
db.port=5432
db.name=proddb
db.username=automation
db.password=changeme

# API
api.baseurl=https://api.example.com
api.timeout=30000

# Reporting
report.screenshot.onfailure=true
report.path=reports/extent
report.html.enabled=true

# Logging
log.level=WARN
log.pattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n