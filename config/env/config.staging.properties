# Environment: STAGING
env=staging

# Application Under Test
app.baseurl=https://staging.example.com
app.timeout=30
app.implicitwait=10

# Selenium WebDriver
driver.type=chrome
driver.headless=true
driver.window.maximize=false
driver.remote.enabled=false
driver.remote.url=

# Database
db.enabled=false
db.type=postgresql
db.host=staging-db.example.com
db.port=5432
db.name=testdb
db.username=automation
db.password=changeme

# API
api.baseurl=https://staging-api.example.com
api.timeout=30000

# Reporting
report.screenshot.onfailure=true
report.path=reports/extent
report.html.enabled=true

# Logging
log.level=INFO
log.pattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n